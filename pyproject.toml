[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "headerguard"
version = "0.1.0"
description = "Passive web security auditor: grades HTTP security headers, TLS and cookies."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Luban Mahi Ninio" }]
requires-python = ">=3.10"
dependencies = []

[project.scripts]
headerguard = "headerguard.__main__:main"
headerguard-web = "headerguard.web:run"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=7", "httpx>=0.27", "fastapi>=0.110", "uvicorn>=0.29"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

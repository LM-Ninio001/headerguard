name: live demo

# Scans the sites in sites.txt and publishes the dashboard with the results
# to GitHub Pages. Runs on every push to main and once a day.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 19 * * *" # 06:17 Sydney time (AEDT)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install .
      - name: Scan sites and build the demo
        run: python -m headerguard.site sites.txt _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
